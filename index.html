<!doctype html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .auth-suggestion {
        display: none;
        background: rgba(255,255,255,0.1);
        border-radius: 20px;
        padding: 30px;
        margin: 30px 0;
        text-align: center;
        color: white;
        font-size: 18px;
      }
      .auth-suggestion a {
        color: #bcec30;
        text-decoration: none;
        font-weight: bold;
        cursor: pointer;
      }
      .auth-suggestion a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1 id="titleHead" style="color: white; margin-bottom: 40px;">Комментарии</h1>

      <!-- Информация о пользователе -->
      <div id="userInfo" style="display: none; margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; color: white;">
        <span style="margin-right: 15px;">Вы вошли как: <span id="userName"></span></span>
        <button id="logoutButton" style="padding: 5px 15px; background: #ff4444; color: white; border: none; border-radius: 5px; cursor: pointer;">
          Выйти
        </button>
      </div>

      <!-- Контейнер для форм авторизации/регистрации -->
      <div id="authContainer"></div>
      
      <!-- Предложение авторизации -->
      <div class="auth-suggestion" id="authSuggestion">
        <p style="margin: 0;">
          Если хочешь оставить свой комментарий - 
          <a id="authSuggestionLink">авторизуйся</a>
        </p>
      </div>

      <!-- Комментарии -->
      <ul class="comments" id="commentsList"></ul>

      <!-- Форма добавления комментария -->
       
      <div class="add-form" style="display: none; margin-top: 48px;">
        <!-- Поле автора (только для чтения) -->
        <input
          type="text"
          class="add-form-name"
          id="authorName"
          placeholder="Автор"
          readonly
          style="background-color: #333; color: white; border: 1px solid #555; cursor: not-allowed;"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш комментарий"
          rows="4"
          id="textInput"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button" id="addButton">Написать</button>
        </div>
      </div>

      <!-- Индикатор загрузки -->
      <div class="form-loading" style="display: none; margin-top: 20px; color: white;">
        Комментарий добавляется...
      </div>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
